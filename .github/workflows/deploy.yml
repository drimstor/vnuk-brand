name: Deploy VNUK Brand

on:
  push:
    branches: [main]
  workflow_dispatch: # Ручной запуск

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production  # Использует Environment variables из Production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64  # Только для сервера AMD64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vnuk-brand:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/vnuk-brand:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/vnuk-brand:latest
          cache-to: type=inline
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting VNUK Brand deployment..."
            
            # Остановить и удалить старый контейнер
            echo "⏸️  Stopping old container..."
            docker stop vnuk-brand 2>/dev/null || true
            docker rm vnuk-brand 2>/dev/null || true
            
            # Скачать новый образ
            echo "📥 Pulling new image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vnuk-brand:latest
            
            # Запустить новый контейнер
            echo "▶️  Starting new container..."
            docker run -d \
              --name vnuk-brand \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/vnuk-brand:latest
            
            # Подождать запуска
            echo "⏳ Waiting for container to start..."
            sleep 5
            
            # Проверить статус
            echo "✅ Checking container status..."
            docker ps | grep vnuk-brand
            
            # Проверить логи
            echo "📋 Recent logs:"
            docker logs --tail=20 vnuk-brand
            
            # Очистить старые образы
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✨ VNUK Brand deployment completed!"
      
      - name: Check deployment
        run: |
          echo "🎉 VNUK Brand deployed successfully!"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/vnuk-brand:latest"
          echo "🌐 Site URL: https://vnuk-brand.com"





